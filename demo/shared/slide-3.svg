<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="sun3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg3)"/>
  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="50" r="2.5"/>
    <circle cx="160" cy="80" r="2"/>
    <circle cx="250" cy="40" r="3"/>
    <circle cx="420" cy="55" r="2.5"/>
    <circle cx="510" cy="85" r="2"/>
    <circle cx="540" cy="40" r="3"/>
    <circle cx="110" cy="130" r="2"/>
  </g>
  <!-- Synthwave Sun -->
  <circle cx="300" cy="175" r="85" fill="url(#sun3)"/>
  <rect x="200" y="185" width="200" height="6" fill="#581c87"/>
  <rect x="200" y="205" width="200" height="8" fill="#581c87"/>
  <rect x="200" y="227" width="200" height="10" fill="#581c87"/>
  <!-- Mountains -->
  <polygon points="0,270 140,145 270,270" fill="#311042" stroke="#c084fc" stroke-width="3"/>
  <polygon points="310,270 460,135 600,270" fill="#311042" stroke="#c084fc" stroke-width="3"/>
  <polygon points="160,270 300,160 440,270" fill="#1e1b4b" stroke="#38bdf8" stroke-width="3"/>
  <!-- Perspective Grid Floor -->
  <rect x="0" y="270" width="600" height="130" fill="#090d16"/>
  <g stroke="#ec4899" stroke-width="2" opacity="0.85">
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="0" y1="295" x2="600" y2="295"/>
    <line x1="0" y1="325" x2="600" y2="325"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="398" x2="600" y2="398"/>
    <line x1="300" y1="270" x2="300" y2="400"/>
    <line x1="250" y1="270" x2="150" y2="400"/>
    <line x1="200" y1="270" x2="0" y2="400"/>
    <line x1="150" y1="270" x2="-150" y2="400"/>
    <line x1="350" y1="270" x2="450" y2="400"/>
    <line x1="400" y1="270" x2="600" y2="400"/>
    <line x1="450" y1="270" x2="750" y2="400"/>
  </g>
</svg>
