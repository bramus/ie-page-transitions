<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" rx="16" fill="#064e3b"/>
  <!-- 2x2 Grid of Classic Filter Visuals -->
  <!-- 1: Checkerboard -->
  <g transform="translate(35, 30)">
    <rect width="245" height="155" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/>
    <g fill="#f59e0b">
      <rect x="20" y="20" width="41" height="38"/>
      <rect x="102" y="20" width="41" height="38"/>
      <rect x="184" y="20" width="41" height="38"/>
      <rect x="61" y="58" width="41" height="38"/>
      <rect x="143" y="58" width="41" height="38"/>
      <rect x="20" y="96" width="41" height="38"/>
      <rect x="102" y="96" width="41" height="38"/>
      <rect x="184" y="96" width="41" height="38"/>
    </g>
  </g>
  <!-- 2: Circle Iris -->
  <g transform="translate(320, 30)">
    <rect width="245" height="155" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
    <circle cx="122" cy="77" r="60" fill="#38bdf8"/>
    <circle cx="122" cy="77" r="40" fill="#0284c7"/>
    <circle cx="122" cy="77" r="20" fill="#fef08a"/>
  </g>
  <!-- 3: Vertical Blinds -->
  <g transform="translate(35, 215)">
    <rect width="245" height="155" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="4"/>
    <g fill="#ec4899">
      <rect x="20" y="18" width="24" height="119" rx="4"/>
      <rect x="62" y="18" width="24" height="119" rx="4"/>
      <rect x="104" y="18" width="24" height="119" rx="4"/>
      <rect x="146" y="18" width="24" height="119" rx="4"/>
      <rect x="188" y="18" width="24" height="119" rx="4"/>
    </g>
  </g>
  <!-- 4: Diagonal Strips -->
  <g transform="translate(320, 215)">
    <rect width="245" height="155" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
    <polygon points="20,20 150,20 20,135" fill="#8b5cf6"/>
    <polygon points="80,20 210,20 20,135" fill="#a78bfa" opacity="0.7"/>
    <circle cx="185" cy="105" r="26" fill="#34d399"/>
  </g>
</svg>
